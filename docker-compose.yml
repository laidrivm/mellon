services:
  mellon-app:
    build: .
    container_name: mellon-app
    ports:
      - "3000:3000"
    environment:
      - COUCH_URL=http://${COUCH_USER}:${COUCH_PASSWORD}@mellon-couchdb:5984
      - EMAIL_SERVICE_URL=http://mellon-email:3001
    volumes:
      - ./.env:/app/.env
    depends_on:
      couchdb-init:
        condition: service_completed_successfully
      mellon-email:
        condition: service_started
    networks:
      - web-network
    restart: always

  mellon-email:
    build: ./email-service
    container_name: mellon-email
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL}
    networks:
      - web-network
    restart: always

  couchdb-init:
    image: curlimages/curl:latest
    depends_on:
      - mellon-couchdb
    networks:
      - web-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -s http://mellon-couchdb:5984/ > /dev/null; do
          echo "Waiting for CouchDB..."
          sleep 2
        done
        # $$ defers expansion to this shell, so the password reaches curl as one
        # quoted argument; 412 means the database already exists.
        for db in _users _replicator _global_changes; do
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            -u "$$COUCH_USER:$$COUCH_PASSWORD" "http://mellon-couchdb:5984/$$db")
          case "$$code" in
            201|202|412) ;;
            *) echo "PUT $$db failed with HTTP $$code"; exit 1 ;;
          esac
        done
        echo "CouchDB initialized"
    environment:
      - COUCH_USER=${COUCH_USER}
      - COUCH_PASSWORD=${COUCH_PASSWORD}

  mellon-couchdb:
    image: couchdb:latest
    container_name: mellon-couchdb
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=${COUCH_USER}
      - COUCHDB_PASSWORD=${COUCH_PASSWORD}
      - COUCHDB_BIND_ADDRESS=0.0.0.0
      - COUCHDB_SECRET=${COUCHDB_SECRET}
      - NODENAME=mellon-couchdb
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./local.ini:/opt/couchdb/etc/local.d/local.ini
    networks:
      - web-network
    restart: always

volumes:
  couchdb-data:

networks:
  web-network:
