# Production stack, run from ~/mellon on the VM beside its .env and local.ini.
# CI's deploy step downloads this file from the deployed commit, replaces the
# VM's copy, pulls the images and runs `docker-compose up -d`.
services:
  mellon-app:
    image: laidrivm/mellon:latest
    container_name: mellon-app
    environment:
      - EMAIL_SERVICE_URL=http://mellon-email:3001
      # Set here, not in .env: the environment wins over .env in Bun, and the
      # public host answers 301, which nano follows as a GET and loses the write.
      - COUCH_URL=http://${COUCH_USER}:${COUCH_PASSWORD}@mellon-couchdb:5984
    volumes:
      - ./.env:/app/.env
    depends_on:
      couchdb-init:
        condition: service_completed_successfully
      mellon-email:
        condition: service_started
    networks:
      - web-network
    restart: always

  mellon-email:
    image: laidrivm/mellon-email:latest
    container_name: mellon-email
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=hey@mellon.sh
    networks:
      - web-network
    restart: always

  couchdb-init:
    image: curlimages/curl:latest
    depends_on:
      - mellon-couchdb
    networks:
      - web-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -s http://mellon-couchdb:5984/ > /dev/null; do
          echo "Waiting for CouchDB..."
          sleep 2
        done
        # $$ defers expansion to this shell, so the password reaches curl as one
        # quoted argument; 412 means the database already exists.
        for db in _users _replicator _global_changes; do
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            -u "$$COUCH_USER:$$COUCH_PASSWORD" "http://mellon-couchdb:5984/$$db")
          case "$$code" in
            201|202|412) ;;
            *) echo "PUT $$db failed with HTTP $$code"; exit 1 ;;
          esac
        done
        echo "CouchDB initialized"
    environment:
      - COUCH_USER=${COUCH_USER}
      - COUCH_PASSWORD=${COUCH_PASSWORD}

  mellon-couchdb:
    image: couchdb:latest
    container_name: mellon-couchdb
    environment:
      - COUCHDB_USER=${COUCH_USER}
      - COUCHDB_PASSWORD=${COUCH_PASSWORD}
      - COUCHDB_BIND_ADDRESS=0.0.0.0
      - COUCHDB_SECRET=${COUCHDB_SECRET}
      - NODENAME=mellon-couchdb
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./local.ini:/opt/couchdb/etc/local.d/local.ini
    networks:
      - web-network
    restart: always

volumes:
  couchdb-data:

# Shared with nginx-proxy, which terminates TLS for mellon.sh and :5984.
networks:
  web-network:
    external: true
